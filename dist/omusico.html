<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111214">
<meta name="color-scheme" content="dark light">
<title>O Músico</title>
<style>
/* O Músico — base: tokens, tipografia, layout principal */
:root{
  --bg:#111214;--bg2:#16171a;--s1:#1b1d20;--s2:#222428;--s3:#2b2e33;--s4:#353940;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --tx:#eceef1;--tx2:#a4a9b0;--tx3:#6c727a;
  --acc:#ff7a1a;--acc2:#ff9a4d;--acc-ink:#1a0d02;--acc-soft:rgba(255,122,26,.14);
  --ok:#3ddc84;--ok-soft:rgba(61,220,132,.14);--warn:#ffc53d;--bad:#ff5a5f;--bad-soft:rgba(255,90,95,.14);
  --chord:#ff9a4d;
  --r1:10px;--r2:14px;--r3:20px;
  --top:56px;--nav:64px;
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
  --sans:"Inter","Roboto","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;
  --mono:"Roboto Mono","JetBrains Mono","DejaVu Sans Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-accent="lime"]{--acc:#c6f432;--acc2:#d8ff6a;--acc-ink:#121a00;--acc-soft:rgba(198,244,50,.13);--chord:#c6f432}
:root[data-theme="light"]{
  --bg:#f3f3f1;--bg2:#ebebe8;--s1:#ffffff;--s2:#f4f4f2;--s3:#e8e8e5;--s4:#d9d9d5;
  --line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.15);
  --tx:#17181a;--tx2:#53575d;--tx3:#8a8f95;
  --acc:#e8620a;--acc2:#ff7a1a;--acc-ink:#fff;--acc-soft:rgba(232,98,10,.11);--chord:#d4560a;
  --ok:#14a35a;--ok-soft:rgba(20,163,90,.12);--bad:#d63c41;--bad-soft:rgba(214,60,65,.1);
  color-scheme:light;
}
:root[data-theme="light"][data-accent="lime"]{--acc:#5c8a00;--acc2:#78b000;--acc-ink:#fff;--acc-soft:rgba(92,138,0,.12);--chord:#4f7700}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
textarea,input[type=text],input[type=search],input[type=number]{user-select:text;-webkit-user-select:text}
button{background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.hidden{display:none!important}

/* ---------- casca do app ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.view.enter{animation:viewIn .26s var(--ease) both}
.view.leave{animation:viewOut .2s ease both;pointer-events:none}
.view.tabview{animation:fadeIn .18s ease both}
@keyframes viewIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes viewOut{to{transform:translateX(28px);opacity:0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.topbar{flex:none;height:calc(var(--top) + var(--safeT));padding:var(--safeT) 6px 0;display:flex;align-items:center;gap:4px;
  background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.topbar .sub{display:block;font-size:12px;font-weight:500;color:var(--tx2);margin-top:-2px}
.topbar .titlewrap{flex:1;min-width:0;padding:0 6px}
.topbar .titlewrap h1{padding:0;font-size:17px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 16px calc(24px + var(--safeB))}
.content.nopad{padding:0}
.tabroot .content{padding-bottom:calc(var(--nav) + 24px + var(--safeB))}

/* ---------- navegação inferior ---------- */
.bnav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safeB));padding-bottom:var(--safeB);display:flex;
  background:var(--bg2);background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);z-index:20;transition:transform .25s var(--ease)}
.bnav.off{transform:translateY(110%)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:600;letter-spacing:.01em;position:relative}
.bnav button svg{width:23px;height:23px}
.bnav button.on{color:var(--tx)}
.bnav button.on::before{content:"";position:absolute;top:6px;width:44px;height:30px;border-radius:15px;background:var(--acc-soft);z-index:-1}
.bnav button.on svg{color:var(--acc)}

/* indicador global do metrônomo */
.metpill{position:absolute;right:12px;bottom:calc(var(--nav) + 12px + var(--safeB));z-index:25;display:flex;align-items:center;gap:8px;
  padding:8px 10px 8px 14px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.35);
  font-weight:650;font-size:14px;animation:fadeIn .2s}
.metpill.lifted{bottom:calc(16px + var(--safeB))}
.metpill .dot{width:10px;height:10px;border-radius:50%;background:var(--tx3);transition:background .05s}
.metpill .dot.beat{background:var(--acc)}
.metpill button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--s4)}
.metpill button svg{width:16px;height:16px}

/* scrollbar discreta (desktop) */
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--s4);border-radius:3px}::-webkit-scrollbar-track{background:transparent}

@media (min-width:700px){
  #app{max-width:760px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* O Músico — componentes reutilizáveis */
.ibtn{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--tx);transition:background .15s}
.ibtn svg{width:22px;height:22px}
.ibtn:active{background:var(--s3)}
.ibtn.on{color:var(--acc)}
.ibtn.sm{width:36px;height:36px}.ibtn.sm svg{width:19px;height:19px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:650;font-size:15px;
  background:var(--s3);color:var(--tx);transition:transform .1s,background .15s,opacity .15s;white-space:nowrap}
.btn svg{width:19px;height:19px}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:10px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow>.btn{flex:1}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:14px}
.card+.card{margin-top:10px}
.card h3{font-size:15px;margin-bottom:8px}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:16px}
.sec .lnk{color:var(--acc);font-size:13px;font-weight:650;padding:6px 0}
.lbl{font-size:12px;font-weight:650;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}

/* busca */
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line)}
.search svg{width:20px;height:20px;color:var(--tx3);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px}
.search input::placeholder{color:var(--tx3)}
.search .clr{color:var(--tx3)}

/* campos */
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:6px}
.inp,select.inp,textarea.inp{width:100%;min-height:46px;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);outline:0;font-size:15px}
.inp:focus{border-color:var(--acc)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.5}
textarea.code{font-family:var(--mono);font-size:13.5px;min-height:300px;white-space:pre;overflow-x:auto}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* segmentado / chips */
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--tx2);padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--s4);color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip svg{width:16px;height:16px}

/* listas */
.list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;position:relative;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--s2)}
.item .tx{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ic{width:42px;height:42px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--s3);color:var(--tx2)}
.item .ic svg{width:21px;height:21px}
.item .ic.acc{background:var(--acc-soft);color:var(--acc)}
.item .end{flex:none;color:var(--tx3);display:flex;align-items:center;gap:6px;font-size:13px}
.item .end svg{width:18px;height:18px}
.keybadge{min-width:34px;height:26px;padding:0 7px;border-radius:7px;background:var(--s3);color:var(--chord);font-weight:700;font-size:13px;display:inline-grid;place-items:center}
.diff{display:inline-flex;gap:2px;vertical-align:middle}
.diff i{width:5px;height:12px;border-radius:2px;background:var(--s4)}
.diff i.on{background:var(--acc)}
.empty{padding:28px 16px;text-align:center;color:var(--tx2);font-size:14px}
.empty svg{width:34px;height:34px;margin:0 auto 10px;color:var(--tx3)}
.empty .btn{margin-top:14px}

/* atalhos (grade) */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;min-height:96px;transition:transform .12s,background .15s}
.tile:active{transform:scale(.97);background:var(--s2)}
.tile .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.tile .ti svg{width:21px;height:21px}
.tile b{font-size:14.5px;font-weight:650;line-height:1.2}
.tile small{display:block;color:var(--tx2);font-size:12px;font-weight:500;margin-top:2px}

/* carrossel horizontal de cartões de música */
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.scard{flex:none;width:148px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:12px;text-align:left;scroll-snap-align:start}
.scard .cov{height:64px;border-radius:10px;margin-bottom:10px;display:flex;align-items:flex-end;justify-content:space-between;padding:8px;font-weight:800;font-size:22px;color:#fff;letter-spacing:-.02em}
.scard .t{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .s{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* folha inferior (bottom sheet) e diálogos */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;animation:fadeIn .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;display:flex;flex-direction:column;background:var(--s1);border-radius:20px 20px 0 0;
  border-top:1px solid var(--line2);padding-bottom:var(--safeB);animation:sheetIn .26s var(--ease)}
@media (min-width:700px){.sheet{max-width:760px;margin:0 auto}}
.sheet.out{animation:sheetOut .18s ease forwards}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--s4);margin:9px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 18px;flex:none}
.sheet .sh h3{flex:1;font-size:17px}
.sheet .sb{overflow-y:auto;padding:4px 18px 20px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 26px + var(--safeB));transform:translateX(-50%);z-index:80;background:var(--tx);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:86vw;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:toastIn .2s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}

/* menu de opções */
.menu .item{min-height:52px}

/* slider */
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;width:100%}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,50%) 100% no-repeat,var(--s4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--tx);margin-top:-8.5px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--s4)}
input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--acc)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--tx)}

/* interruptor */
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:14px;background:var(--s4);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(18px)}

/* stepper */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--s3);display:grid;place-items:center}
.stepper button svg{width:18px;height:18px}
.stepper b{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* diagrama de acorde */
.cdiag{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.cdiag .cn{font-weight:750;font-size:15px;color:var(--chord)}
.cdiag svg{overflow:visible}
.cdiag .dg-grid{stroke:var(--tx3)}
.cdiag .dg-nut{fill:var(--tx)}
.cdiag .dg-dot{fill:var(--tx)}
.cdiag .dg-root{fill:var(--acc)}
.cdiag .dg-fn{fill:var(--bg);font-size:8.5px;font-weight:800}
.cdiag .dg-root+.dg-fn{fill:var(--acc-ink)}
.cdiag .dg-txt{fill:var(--tx2);font-size:9px;font-weight:600}
.cdiag .dg-ox{stroke:var(--tx2);fill:none}
.cdiag .dg-x{stroke:var(--tx3)}

/* teclado de piano */
.piano{width:100%;height:auto}
.piano .wk{fill:#f4f4f2;stroke:#9a9a9a;stroke-width:.6}
.piano .bk{fill:#1d1e21;stroke:#000;stroke-width:.6}
.piano .wk.hl{fill:#f7c39b;fill:color-mix(in srgb,var(--acc) 42%,#f4f4f2)}
.piano .bk.hl{fill:#a6541c;fill:color-mix(in srgb,var(--acc) 70%,#1d1e21)}
.piano .wk.rt{fill:var(--acc)}
.piano .kl{font-size:7.5px;font-weight:700;fill:#333;text-anchor:middle;pointer-events:none}
.piano .kl.b{fill:#fff}
.piano rect{cursor:pointer}

/* braço do instrumento */
.fretwrap{overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:thin}
.fretboard .fb-bg{fill:var(--s2)}
.fretboard .fb-fret{stroke:var(--tx3);stroke-width:1.2}
.fretboard .fb-nut{stroke:var(--tx);stroke-width:4}
.fretboard .fb-str{stroke:var(--tx2)}
.fretboard .fb-mark{fill:var(--s4)}
.fretboard .fb-n{fill:var(--s4);stroke:var(--line2)}
.fretboard .fb-n.on{fill:var(--tx);stroke:none}
.fretboard .fb-n.rt{fill:var(--acc);stroke:none}
.fretboard .fb-l{font-size:9px;font-weight:750;text-anchor:middle;dominant-baseline:central;fill:var(--bg);pointer-events:none}
.fretboard .fb-n.rt+.fb-l{fill:var(--acc-ink)}
.fretboard .fb-fn{font-size:9px;fill:var(--tx3);text-anchor:middle}
.fretboard .fb-sn{font-size:10px;font-weight:700;fill:var(--tx2);text-anchor:middle;dominant-baseline:central}
.fretboard .hit{fill:transparent;cursor:pointer}
.fretboard .q{fill:var(--acc)}

/* pauta */
.staff{width:100%;height:auto;color:var(--tx)}
.staff .ln{stroke:currentColor;stroke-width:1;opacity:.75}
.staff .bar{stroke:currentColor;stroke-width:1.2}
.staff .nh{fill:currentColor}
.staff .nh.open{fill:none;stroke:currentColor;stroke-width:1.6}
.staff .stem{stroke:currentColor;stroke-width:1.3}
.staff .clef,.staff .acc,.staff .ts{fill:currentColor}
.staff .cur{color:var(--acc)}
.staff .ok{color:var(--ok)}
.staff .bad{color:var(--bad)}

/* progresso */
.prog{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s var(--ease)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:650;text-align:right}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--tx2)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--s3);color:var(--tx2)}
.badge.acc{background:var(--acc-soft);color:var(--acc)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--s2);color:var(--tx2);font-size:13.5px;border:1px solid var(--line)}
.notice svg{width:20px;height:20px;flex:none;color:var(--acc);margin-top:1px}
.notice.err{background:var(--bad-soft);color:var(--tx)}
.notice.err svg{color:var(--bad)}
.fretboard .fb-n.q{fill:var(--acc);stroke:var(--tx);stroke-width:2}
.chip.on{pointer-events:auto}

/* O Músico — estilos específicos das telas */

/* início */
.hello{padding:10px 0 14px}
.hello h1{font-size:25px;letter-spacing:-.02em}
.hello p{color:var(--tx2);font-size:14px;margin-top:2px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;flex:1}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center}
.brand .logo svg{width:19px;height:19px}
.brand b{font-size:18px;font-weight:750;letter-spacing:-.02em}

/* visualizador de cifra */
.song-head{padding:4px 0 12px}
.song-head h2{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.song-head .by{color:var(--tx2);font-size:14.5px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta .badge{height:26px}
.tbar{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);flex:none;scrollbar-width:none;background:var(--bg)}
.tbar::-webkit-scrollbar{display:none}
.tbar .grp{display:flex;align-items:center;gap:2px;background:var(--s2);border-radius:11px;padding:2px;flex:none}
.tbar .grp b{min-width:34px;text-align:center;font-size:14px;color:var(--chord)}
.tbar .grp .ibtn{width:34px;height:34px}
.tbar .grp .ibtn svg{width:18px;height:18px}
.tbar .tb{flex:none;height:38px;padding:0 11px;border-radius:11px;background:var(--s2);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--tx2)}
.tbar .tb svg{width:18px;height:18px}
.tbar .tb.on{background:var(--acc-soft);color:var(--acc)}
.chordstrip{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;margin:0 -16px 6px;scrollbar-width:none}
.chordstrip::-webkit-scrollbar{display:none}
.chordstrip .cdiag{flex:none}
.sheetmusic{font-size:var(--fs,16px);line-height:1.3}
.sl{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.4em;margin:0 0 .35em}
.sl.lyriconly{margin-bottom:.2em}
.seg-c{display:inline-flex;flex-direction:column;white-space:pre}
.seg-c .c{color:var(--chord);font-weight:750;font-size:.94em;min-height:1.3em;padding-right:.45em;cursor:pointer;border-radius:4px;transition:background .15s,color .15s}
.seg-c .c:empty{cursor:default}
.seg-c .c.cur{background:var(--acc);color:var(--acc-ink);padding:0 .3em;margin-left:-.3em}
.seg-c .l{min-height:1.3em}
.sl.chordonly .seg-c .l{display:none}
.sl.blank{min-height:.8em}
.sl.cmt{color:var(--tx2);font-weight:700;font-size:.85em;text-transform:uppercase;letter-spacing:.05em;margin:1.1em 0 .4em}
.chorus{border-left:3px solid var(--acc);padding-left:12px;margin:.4em 0 .8em}
.tabblock{font-family:var(--mono);font-size:calc(var(--fs,16px)*.78);line-height:1.35;white-space:pre;overflow-x:auto;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:.6em 0 1em}
.songnotes{margin-top:18px}
.present{background:#000!important}
.present .topbar,.present .tbar{display:none}
.present .content{padding-top:calc(16px + var(--safeT))}
.present .sheetmusic{--fs:24px}
.present .song-head .meta,.present .chordstrip,.present .songextra{display:none}
.presbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:12px 12px calc(12px + var(--safeB));
  background:linear-gradient(transparent,rgba(0,0,0,.85) 40%);opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
.presbar.show{opacity:1;pointer-events:auto}
.presbar .btn{background:rgba(255,255,255,.12);color:#fff}
.scrollctl{position:absolute;right:14px;bottom:calc(16px + var(--safeB));z-index:6;display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--s3);border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.scrollctl b{min-width:30px;text-align:center;font-size:13px}
.scrollctl .ibtn{width:38px;height:38px}
.practicebar{position:absolute;left:10px;right:10px;bottom:calc(12px + var(--safeB));z-index:6;display:flex;flex-direction:column;gap:4px;padding:10px 8px 8px 14px;border-radius:18px;background:var(--s3);border:1px solid var(--line2);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.practicebar .prow{display:flex;align-items:center;gap:6px}
.practicebar .pc{flex:1;min-width:0}
.practicebar .pc b{font-size:24px;color:var(--chord);font-weight:800;margin-right:10px}
.practicebar .pc small{font-size:12.5px;color:var(--tx2)}
.practicebar small.dim{font-size:11.5px;font-weight:600}
.practicebar .stepper button{width:34px;height:34px}
.practicebar .stepper b{min-width:32px}
.beats{display:flex;gap:4px;margin-top:3px}
.beats i{width:8px;height:8px;border-radius:50%;background:var(--s4)}
.beats i.on{background:var(--acc)}

/* afinador */
.tuner{display:flex;flex-direction:column;align-items:center;padding-top:8px}
.tn-note{font-size:88px;font-weight:800;line-height:1;letter-spacing:-.04em;display:flex;align-items:flex-start;transition:color .2s;min-height:90px}
.tn-note sup{font-size:34px;margin-top:8px;font-weight:700}
.tn-note sub{font-size:24px;align-self:flex-end;color:var(--tx3);margin-bottom:10px;font-weight:600}
.tn-note.ok{color:var(--ok)}
.tn-hz{font-size:15px;color:var(--tx2);margin-top:6px;min-height:22px}
.tn-gauge{width:100%;max-width:420px;margin:10px auto 0}
.tn-gauge .tick{stroke:var(--tx3)}
.tn-gauge .tick.big{stroke:var(--tx2)}
.tn-gauge .zone{fill:var(--ok-soft)}
.tn-gauge .needle{stroke:var(--tx);stroke-width:3;stroke-linecap:round;transition:transform .09s linear}
.tn-gauge .needle.ok{stroke:var(--ok)}
.tn-gauge .hub{fill:var(--tx)}
.tn-gauge text{fill:var(--tx3);font-size:11px;font-weight:600;text-anchor:middle}
.tn-cents{font-size:16px;font-weight:700;margin-top:2px;min-height:24px}
.tn-dir{display:flex;gap:18px;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--tx3);margin-top:4px}
.tn-dir .on{color:var(--warn)}
.tn-level{width:160px;height:4px;border-radius:2px;background:var(--s3);overflow:hidden;margin-top:12px}
.tn-level i{display:block;height:100%;background:var(--tx3);width:0;transition:width .08s}
.strings{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}
.strbtn{min-width:52px;height:60px;padding:0 6px;border-radius:14px;background:var(--s2);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all .15s}
.strbtn b{font-size:18px;font-weight:750}
.strbtn small{font-size:10.5px;color:var(--tx3);font-weight:600}
.strbtn.cur{border-color:var(--acc);background:var(--acc-soft)}
.strbtn.done{border-color:var(--ok)}
.strbtn.done b{color:var(--ok)}
.strbtn.sel{box-shadow:0 0 0 2px var(--tx)}

/* metrônomo */
.met{display:flex;flex-direction:column;align-items:center}
.met-bpm{font-size:84px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.met-it{color:var(--tx2);font-weight:600;font-size:14px;margin-top:4px}
.met-beats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0 6px}
.met-beats button{width:40px;height:40px;border-radius:50%;background:var(--s3);border:2px solid transparent;position:relative;transition:transform .06s,background .06s}
.met-beats button[data-a="2"]{border-color:var(--acc)}
.met-beats button[data-a="0"]{opacity:.35;background:transparent;border:2px dashed var(--s4)}
.met-beats button.on{background:var(--tx);transform:scale(1.12)}
.met-beats button.on[data-a="2"]{background:var(--acc)}
.met-pulse{width:100%;height:6px;border-radius:3px;background:var(--s2);overflow:hidden;margin:6px 0 4px}
.met-pulse i{display:block;height:100%;width:100%;background:var(--acc);opacity:0;transition:opacity .25s ease-out}
.met-pulse i.hit{opacity:1;transition:none}
.flash{position:absolute;inset:0;pointer-events:none;background:var(--acc);opacity:0;z-index:4;transition:opacity .22s ease-out}
.flash.hit{opacity:.13;transition:none}
.bigplay{width:84px;height:84px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;box-shadow:0 10px 30px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .1s}
.bigplay svg{width:36px;height:36px}
.bigplay:active{transform:scale(.95)}
.met-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:16px 0}
.roundbtn{width:56px;height:56px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-weight:750}
.roundbtn svg{width:22px;height:22px}
.tapbtn{width:100%;height:64px;border-radius:16px;background:var(--s2);border:1px dashed var(--line2);font-weight:750;font-size:16px;color:var(--tx2)}
.tapbtn:active{background:var(--acc-soft);color:var(--acc)}

/* identificador / gravador */
.roll{width:100%;height:150px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.wave{width:100%;height:90px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.rectime{font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:14px 0 4px}
.recbtn{width:78px;height:78px;border-radius:50%;background:var(--bad);display:grid;place-items:center;margin:8px auto;box-shadow:0 0 0 6px var(--bad-soft)}
.recbtn i{width:28px;height:28px;border-radius:50%;background:#fff;transition:all .2s}
.recbtn.on i{border-radius:6px;width:26px;height:26px}
audio{width:100%;height:40px;margin-top:8px}

/* aprendizagem / quiz */
.qhead{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.qhead .prog{flex:1}
.qcard{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:18px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.qcard .big{font-size:44px;font-weight:800;letter-spacing:-.02em}
.qcard .ask{color:var(--tx2);font-size:14px;font-weight:600}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qopts.three{grid-template-columns:repeat(3,1fr)}
.qopts.four{grid-template-columns:repeat(4,1fr)}
.qopt{min-height:56px;border-radius:14px;background:var(--s2);border:1.5px solid var(--line);font-weight:700;font-size:16px;padding:6px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.qopt:active{transform:scale(.97)}
.qopt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.qopt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.qopt .cdiag .cn{display:none}
.result{text-align:center;padding:20px 0}
.result .score{font-size:64px;font-weight:800;letter-spacing:-.03em}
.lvls{display:flex;gap:6px;flex-wrap:wrap}
.lvl{height:32px;min-width:44px;padding:0 10px;border-radius:9px;background:var(--s3);font-weight:700;font-size:13px;color:var(--tx2);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.lvl.on{background:var(--acc);color:var(--acc-ink)}
.lvl.lock{opacity:.4}
.lvl svg{width:13px;height:13px}
.tapzone{width:100%;height:180px;border-radius:var(--r3);background:var(--s2);border:2px dashed var(--line2);display:grid;place-items:center;font-weight:750;font-size:18px;color:var(--tx2);margin-top:14px}
.tapzone:active{background:var(--acc-soft)}
.offsets{display:flex;align-items:center;gap:3px;height:60px;padding:0 4px;border-radius:12px;background:var(--s1);margin-top:12px;position:relative;overflow:hidden}
.offsets::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line2)}
.offsets i{flex:1;max-width:12px;border-radius:2px;background:var(--acc);position:relative}

/* acordes e escalas */
.notes-row{display:flex;gap:6px;flex-wrap:wrap}
.notepill{min-width:42px;height:42px;padding:0 8px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-weight:750;font-size:15px}
.notepill small{font-size:10px;color:var(--tx3);font-weight:650}
.notepill.rt{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.voicings{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.voicings .vc{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.voicings .vc small{font-size:11px;color:var(--tx3);font-weight:600}
.keyrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.keyrow button{height:40px;border-radius:10px;background:var(--s2);font-weight:700;font-size:14px;border:1px solid var(--line)}
.keyrow button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.harm{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.harm button{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.harm b{display:block;color:var(--chord);font-size:16px}
.harm small{color:var(--tx3);font-size:11px;font-weight:700}
.out{font-family:var(--mono);white-space:pre-wrap;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;min-height:60px;user-select:text;-webkit-user-select:text}

/* grooves */
.seqgrid{display:grid;gap:4px;margin-top:10px}
.seqrow{display:grid;grid-template-columns:62px 1fr;gap:6px;align-items:center}
.seqrow>span{font-size:12px;font-weight:700;color:var(--tx2)}
.seqsteps{display:grid;gap:3px}
.seqsteps button{height:30px;border-radius:5px;background:var(--s2);border:1px solid var(--line)}
.seqsteps button.q{background:var(--s3)}
.seqsteps button.on{background:var(--acc);border-color:var(--acc)}
.seqsteps button.play{outline:2px solid var(--tx);outline-offset:-2px}

/* dicionário */
.dict dt{font-weight:700;margin-top:14px}
.dict dd{margin:2px 0 0;color:var(--tx2);font-size:14px}

/* perfil */
.avatar{width:64px;height:64px;border-radius:20px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:26px;font-weight:800}
.streak{display:flex;gap:4px;margin-top:10px}
.streak i{flex:1;height:26px;border-radius:5px;background:var(--s3)}
.streak i.l1{background:color-mix(in srgb,var(--acc) 35%,var(--s3))}
.streak i.l2{background:color-mix(in srgb,var(--acc) 65%,var(--s3))}
.streak i.l3{background:var(--acc)}
.tn-dir span{display:inline-flex;align-items:center;gap:2px}
.tn-dir svg{width:16px;height:16px}

/* gravação sobre a cifra */
.recpill{position:absolute;right:12px;top:calc(var(--top) + var(--safeT) + 64px);z-index:7;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:999px;
  background:var(--s3);border:1px solid var(--bad);box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:14px}
.present .recpill{top:calc(12px + var(--safeT))}
.recpill .rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:blink 1s infinite}
.recpill .rlvl{width:44px;height:4px;border-radius:2px;background:var(--s4);overflow:hidden}
.recpill .rlvl i{display:block;height:100%;width:100%;background:var(--bad);transform-origin:left;transform:scaleX(.05);transition:transform .06s}
.recpill button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff}
.recpill button svg{width:14px;height:14px}
@keyframes blink{50%{opacity:.25}}

</style>

<script>
/* ===== js/core/util.js ===== */
/* O Músico — utilitários de DOM e formatação */
window.OM = window.OM || {};
(function (OM) {
  "use strict";

  /* h("div.cls#id", {props}, ...filhos) — cria elementos */
  function h(sel, props) {
    var m = /^([a-z0-9]+)?([^]*)$/i.exec(sel || "div");
    var tag = m[1] || "div", rest = m[2] || "";
    var el = /^(svg|path|circle|rect|line|text|g|polyline|polygon|ellipse)$/.test(tag)
      ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
    rest.replace(/([.#])([\w-]+)/g, function (_, t, v) {
      if (t === ".") el.classList.add(v); else el.id = v;
    });
    var start = 1;
    if (props && typeof props === "object" && !(props instanceof Node) && !Array.isArray(props)) {
      start = 2;
      for (var k in props) {
        var v = props[k];
        if (v == null || v === false) continue;
        if (k === "class") v.split(/\s+/).forEach(function (c) { if (c) el.classList.add(c); });
        else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
        else if (k === "html") el.innerHTML = v;
        else if (k === "text") el.textContent = v;
        else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
        else if (k === "value" && "value" in el) el.value = v;
        else if (k === "checked") el.checked = !!v;
        else el.setAttribute(k, v === true ? "" : v);
      }
    }
    for (var i = start; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  function svg(markup, cls) {
    var d = document.createElement("div");
    d.innerHTML = markup;
    var s = d.firstChild;
    if (cls) s.setAttribute("class", cls);
    return s;
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function norm(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function uid(p) { return (p || "id") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function debounce(fn, ms) {
    var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { fn.apply(s, a); }, ms); };
  }
  function fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function fmtDur(min) {
    min = Math.round(min);
    if (min < 60) return min + " min";
    return Math.floor(min / 60) + " h " + (min % 60 ? (min % 60) + " min" : "");
  }
  function fmtDate(ts) {
    var d = new Date(ts), now = new Date();
    var day = 864e5, t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var hm = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    if (ts >= t0) return "Hoje, " + hm;
    if (ts >= t0 - day) return "Ontem, " + hm;
    return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }) + ", " + hm;
  }
  function dayKey(ts) { var d = new Date(ts || Date.now()); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function rangeFill(input) {
    var p = (input.value - input.min) / (input.max - input.min) * 100;
    input.style.setProperty("--p", p + "%");
  }
  /* cor estável a partir de um texto (capas) */
  function hue(s) { var x = 0; for (var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 360; return x; }

  OM.u = { h: h, svg: svg, clear: clear, esc: esc, norm: norm, clamp: clamp, uid: uid, debounce: debounce, fmtTime: fmtTime,
    fmtDur: fmtDur, fmtDate: fmtDate, dayKey: dayKey, shuffle: shuffle, pick: pick, rangeFill: rangeFill, hue: hue };
})(window.OM);

/* ===== js/core/store.js ===== */
/* O Músico — armazenamento local
   localStorage: configurações, biblioteca pessoal, histórico (JSON pequeno)
   IndexedDB:    gravações de áudio (blobs) */
(function (OM) {
  "use strict";
  var P = "om.";

(function (OM) {

      h("button", { html: OM.icon("stop"), "aria-label": "Parar metrônomo", onclick: function (e) { e.stopPropagation(); OM.metro.stop(); } }));

    var depth = 0, onMet = false, started = 0;
    function sync() {
      pill.classList.toggle("hidden", !OM.metro.S.running || onMet);

    }
    document.addEventListener("om:nav", function (e) { depth = e.detail.depth; onMet = e.detail.name === "metronome" || e.detail.name === "song"; sync(); });
    OM.metro.on(function (ev, d) {
      if (ev === "beat") { dot.classList.add("beat"); setTimeout(function () { dot.classList.remove("beat"); }, 90); }

  }

    window.App = {
      voltar: function () { if (!OM.router.back()) OM.bridge.exit(); },
